server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Server-Sent Events for /api/events. Buffering must be off or the stream stalls,
  # and the read timeout has to outlive the 25s keep-alive ping.
  location /api/events {
    proxy_pass http://api:4000/api/events;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pipeline and embedding calls can be slow; do not cut them short.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Hashed assets are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: unknown paths fall through to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
